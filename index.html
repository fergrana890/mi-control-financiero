<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Control Financiero 2.0</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#f8fafc;padding:22px}main{max-width:600px;margin:auto}h1{font-size:1.65rem;margin-bottom:4px}p.muted,.hint{color:#a7b4c9}.card{background:#17243a;padding:22px;border-radius:20px;margin:20px 0;box-shadow:0 8px 28px #0002}.mic{display:block;margin:20px auto;border:0;border-radius:50%;height:106px;width:106px;background:#22c55e;font-size:44px;cursor:pointer}.mic.listening{background:#ef4444;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.06)}}label{display:block;margin:14px 0 6px;color:#d5e0ef}textarea,input,select{display:block;width:100%;background:#0d172a;color:#fff;border:1px solid #40516b;border-radius:10px;padding:12px;font-size:16px}textarea{resize:vertical}button.action{border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;padding:14px;width:100%;margin-top:18px;cursor:pointer}button.secondary{background:#465974}.status{text-align:center;min-height:42px;color:#cbd5e1}.notice{padding:12px;border-radius:10px;background:#0e1a2f;color:#a7f3d0;margin-top:14px}.warning{color:#fbbf24}.small{font-size:.85rem;color:#a7b4c9}
</style>
</head>
<body><main><h1>💰 Mi Control Financiero</h1><p class="muted">Versión 2.0 · Prueba de voz</p>
<section class="card"><h2>🎙️ Registrar movimiento</h2><button class="mic" id="mic" type="button" aria-label="Activar micrófono">🎤</button><div class="status" id="status" aria-live="polite">Tocá el micrófono para hablar</div><label for="texto">Escribí o dictá tu movimiento</label><textarea id="texto" rows="3" placeholder="Gasté quince mil pesos en combustible para CLICK"></textarea><button class="action secondary" id="interpretar" type="button">🧠 Interpretar movimiento</button><div id="resultado" class="notice" hidden></div></section>
<section class="card"><h2>📝 Detalles del movimiento</h2><label for="tipo">Tipo</label><select id="tipo"><option>Gasto</option><option>Ingreso</option></select><label for="actividad">Actividad</label><select id="actividad"><option>Personal</option><option>CLICK!</option><option>Pelota Dividida</option><option>Préstamos</option><option>Futsal</option></select><label for="categoria">Categoría</label><input id="categoria"><label for="descripcion">Descripción</label><input id="descripcion"><label for="importe">Importe ($)</label><input id="importe" type="number" min="0" step="0.01"><p class="small">Esta versión es de prueba: todavía no envía ni guarda datos en Google Sheets.</p></section>
</main><script>
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const units={un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintiun:21,veintiuna:21,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90};
const hundreds={cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,cuatrocientas:400,quinientos:500,quinientas:500,seiscientos:600,seiscientas:600,setecientos:700,setecientas:700,ochocientos:800,ochocientas:800,novecientos:900,novecientas:900};
function numberFromWords(s){let tokens=norm(s).replace(/[^a-z\s]/g,' ').split(/\s+/),best=null;for(let i=0;i<tokens.length;i++){let total=0,part=0,seen=false,j=i;for(;j<tokens.length;j++){let w=tokens[j];if(w in units){part+=units[w];seen=true}else if(w in hundreds){part+=hundreds[w];seen=true}else if(w==='mil'){total+=(part||1)*1000;part=0;seen=true}else if(w==='y'&&seen){continue}else break}if(seen&&(!best||j-i>best.len))best={len:j-i,value:total+part}}return best?.value??null}
function amount(s){const m=s.match(/(?:\$\s*)?\b\d[\d.,]*\b/);if(m){let v=m[0].replace('$','').trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');return Number(v)}return numberFromWords(s)}
function interpretar(){const s=$('texto').value.trim(),t=norm(s);if(!s){$('resultado').hidden=true;return} $('tipo').value=/\b(ingrese|ingresaron|cobre|recibi|vendi|gane|me pagaron|me depositaron)\b/.test(t)?'Ingreso':'Gasto';$('actividad').value=/click|almacen/.test(t)?'CLICK!':/pelota dividida|remera|estampado/.test(t)?'Pelota Dividida':/prestamo|preste/.test(t)?'Préstamos':/futsal/.test(t)?'Futsal':'Personal';$('categoria').value=/nafta|combustible|colectivo|taxi/.test(t)?'Transporte':/mercaderia|proveedor/.test(t)?'Mercadería':/comida|almuerzo|cena|desayuno/.test(t)?'Alimentación':/remera|estampado|dtf/.test(t)?'Indumentaria':/cuota/.test(t)?'Cuotas':/venta|vendi/.test(t)?'Ventas':'Otros';$('descripcion').value=s;let n=amount(s);$('importe').value=n??'';$('resultado').hidden=false;$('resultado').textContent=n===null?'⚠️ No pude identificar el importe. Completalo manualmente.':'✅ Movimiento interpretado. Revisá los datos.';$('resultado').className=n===null?'notice warning':'notice'}
$('texto').addEventListener('input',interpretar);$('interpretar').addEventListener('click',interpretar);
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,active=false;
$('mic').addEventListener('click',()=>{if(active&&rec){rec.stop();return}if(!Speech){$('status').textContent='Este navegador no admite reconocimiento de voz. Probá Chrome o el dictado del teclado.';return}rec=new Speech();rec.lang='es-AR';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{active=true;$('mic').classList.add('listening');$('status').textContent='🎙️ Escuchando...'};rec.onresult=e=>{$('texto').value=e.results[0][0].transcript;interpretar();$('status').textContent='✅ Voz reconocida'};rec.onerror=e=>{$('status').textContent='Error de micrófono: '+e.error};rec.onend=()=>{active=false;$('mic').classList.remove('listening');if($('status').textContent==='🎙️ Escuchando...')$('status').textContent='No se detectó ninguna frase.'};try{rec.start()}catch(e){$('status').textContent='No se pudo iniciar el micrófono.'}});
</script></body></html>
